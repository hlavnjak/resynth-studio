[package]
name = "resynth-studio"
version = "0.4.0"
edition = "2021"
# The crate also ships `src/bin/dump_render.rs`, a debugging tool. Without this,
# two binaries make a bare `cargo run` ambiguous and it refuses to start.
default-run = "resynth-studio"
authors = ["Jakub Hlavnicka <hlavnickajakub@gmail.com>"]
license = "Apache-2.0"
description = "A Rust DAW (egui/eframe) that hosts VST3, CLAP, VST2, LV2 and AU plugins and resynthesizes arbitrary audio through an embedded LeSynth Fourier additive synth."
readme = "README.md"
keywords = ["daw", "vst3", "clap", "audio", "resynthesis"]
categories = ["multimedia::audio"]

[dependencies]
# Plugin hosting: VST3 through the `vst3` crate, CLAP through `clap-sys`.
# VST2, LV2 and Audio Units need no crate — see src/plugin/.
vst3 = "0.3.0"
libloading = "0.7"

# Audio I/O
cpal = "0.15.3"

# MIDI
midir = "0.9"

# Audio file decoding (.wav / .mp3) for the resynthesis feature — pure Rust.
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "pcm", "isomp4", "aac", "alac"] }

# GUI
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui = "0.31"

# Native file-open dialog. Force the GTK3 backend on Linux — the default
# xdg-portal backend needs a running xdg-desktop-portal, which isn't present
# here; GTK3 is. On Windows/macOS this resolves to the native dialog.
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }

# Utilities
anyhow = "1.0"
log = "0.4"
fern = "0.6"
chrono = { version = "0.4", features = ["clock"] }
uuid = { version = "1.25.0", features = ["v4"] }
clap-sys = "0.5.0"

# Plugin editor window — raw X11 on Linux, raw Win32 on Windows.
[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2.21"

# `poll(2)`, so the editor window — and a CLAP plugin's own main thread — can
# wait on the file descriptors a hosted plugin registers instead of spinning.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The plugin editor window on macOS (an NSWindow). The versions winit already
# pulls in, so nothing new is built.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSGeometry", "NSString", "NSThread"] }
objc2-app-kit = { version = "0.2", features = ["NSClipView", "NSGraphics", "NSResponder", "NSScrollView", "NSView", "NSWindow"] }

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["winuser", "libloaderapi", "windef", "minwindef"] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
